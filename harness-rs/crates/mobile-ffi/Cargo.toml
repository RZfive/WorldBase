[package]
name = "worldbase-mobile-ffi"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["desktop-support"]
# 兼容既有构建命令；当前移动端工具隔离由 runtime capabilities 执行。
desktop-support = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

worldbase-core = { path = "../core" }
worldbase-mcp-client = { path = "../mcp-client" }
worldbase-memory = { path = "../memory" }
worldbase-protocol = { path = "../protocol" }
