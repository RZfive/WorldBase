[workspace]
members = [
    "crates/protocol",
    "crates/providers",
    "crates/tools",
    "crates/core",
    "crates/cli",
    # P1 能力层
    "crates/memory",
    "crates/skills",
    "crates/group",
    "crates/scheduler",
    "crates/mcp-client",
    "crates/docs",
    "crates/search",
    # P2/P4 接入层与桌面专属
    "crates/app-server",
    "crates/exec",
    "crates/project-runtime",
    "crates/im-gateway",
    "crates/mobile-ffi",
]
resolver = "2"

[workspace.package]
version = "1.6.7"
edition = "2021"
authors = ["WorldBase Team"]
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"

base64 = "0.22"
# Rust Studio owns thumbnail generation in Rust mode. Keep the decoder set
# deliberately small; unsupported formats still serve the original image.
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }

# HTTP server (serve / im-gateway)
axum = { version = "0.8", features = ["ws"] }

# Database (FTS5 由 bundled 构建启用)
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# SHA-1 is used only for Electron-compatible project identifier suffixes.
sha1 = "0.10"
# SHA-256 is used for Electron-compatible source/build hashes.
sha2 = "0.10"
unicode-normalization = "0.1"

# Async trait
async-trait = "0.1"

# Futures
futures = "0.3"

# 时间与调度
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"

# 文档解析/编辑
calamine = "0.26"
lopdf = "0.34"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# 测试
tempfile = "3"

# 搜索
regex = "1"
ignore = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
