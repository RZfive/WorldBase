name: Release

# 发布流程：推送 v* tag 触发。
# 1. 复用四端构建（Android versionCode 沿用 run number）
# 2. 汇总产物创建 Draft Release——人工核对并补写 notes 后点 Publish 才对用户可见

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist-artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mapfile -d '' files < <(find dist-artifacts -type f -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no artifacts found under dist-artifacts"
            exit 1
          fi
          echo "Attaching ${#files[@]} files to draft release $TAG"
          # 之前失败的 run 可能残留同名 draft，先清掉保证 tag 可重推重跑
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --title "WorldBase $TAG" \
            "${files[@]}"
