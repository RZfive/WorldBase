name: Release

# 发布流程：推送 v* tag 触发。
# 1. 复用四端构建（Android versionCode 沿用 run number）
# 2. 汇总产物创建 Draft Release——人工核对并补写 notes 后点 Publish 才对用户可见
#    Release 只挂四端安装包（exe/dmg/AppImage/apk）；热更包仅留在 workflow artifacts，供官网发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist-artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # job 未 checkout 仓库，gh 靠该变量解析 owner/repo，否则会报 "not a git repository"
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Release 只挂四端安装包；热更包（WorldBase-hot-*.zip）走官网发布，
          # 从本次 workflow run 的 artifacts（windows-build / mac-arm-build / linux-build）下载
          mapfile -d '' files < <(find dist-artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.apk' \) -print0 | sort -z)
          # 四端各至少一个安装包，缺了直接报错而不是发出残缺 release
          for pat in '*.exe' '*.dmg' '*.AppImage' '*.apk'; do
            if [ -z "$(find dist-artifacts -type f -name "$pat" -print -quit)" ]; then
              echo "::error::no $pat installer found under dist-artifacts"
              exit 1
            fi
          done
          echo "Attaching ${#files[@]} files to draft release $TAG"
          # 之前失败的 run 可能残留同名 draft，先清掉保证 tag 可重推重跑
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --title "WorldBase $TAG" \
            "${files[@]}"
