name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts (keep latest 5 per name)
        uses: actions/github-script@v7
        with:
          script: |
            const artifactNames = ['windows-build', 'mac-arm-build'];
            const keepCount = 5;

            for (const name of artifactNames) {
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                { owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100 }
              );
              // newest first
              artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const toDelete = artifacts.slice(keepCount);
              for (const artifact of toDelete) {
                console.log(`Deleting artifact: ${artifact.name} (id=${artifact.id}, created=${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

  build-windows:
    needs: cleanup
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Compile Electron TypeScript
        run: pnpm build:electron

      - name: Build Electron (Windows)
        run: pnpm exec electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.exe

  build-mac-arm:
    needs: cleanup
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Compile Electron TypeScript
        run: pnpm build:electron

      - name: Build Electron (macOS ARM)
        run: pnpm exec electron-builder --mac --arm64 --publish never

      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm-build
          path: release/*.dmg
