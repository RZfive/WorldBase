name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts (keep latest 5 per name)
        uses: actions/github-script@v7
        with:
          script: |
            const artifactNames = ['windows-build', 'mac-arm-build'];
            const keepCount = 5;

            for (const name of artifactNames) {
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                { owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100 }
              );
              // newest first
              artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const toDelete = artifacts.slice(keepCount);
              for (const artifact of toDelete) {
                console.log(`Deleting artifact: ${artifact.name} (id=${artifact.id}, created=${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

  build-windows:
    needs: cleanup
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Compile Electron TypeScript
        run: pnpm build:electron

      - name: Build Electron (Windows)
        run: pnpm exec electron-builder --win --publish never

      - name: Upload Windows packages to File.io
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows package files found in release/"
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Uploading $file to File.io..."
            response="$(curl --silent --show-error --fail --connect-timeout 15 --max-time 300 -F "file=@${file}" https://file.io)"
            link="$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); if (!data.success || !data.link) { console.error('Invalid File.io response:', data); process.exit(1); } process.stdout.write(data.link);" <<<"$response")"
            filename="$(basename "$file")"
            echo "File.io link for ${filename}: ${link}"
            echo "::notice title=File.io upload::${filename}: ${link}"
            printf -- "- %s: %s\n" "$filename" "$link" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.exe

  build-mac-arm:
    needs: cleanup
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Compile Electron TypeScript
        run: pnpm build:electron

      - name: Build Electron (macOS ARM)
        run: pnpm exec electron-builder --mac --arm64 --publish never

      - name: Upload macOS ARM packages to File.io
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS ARM package files found in release/"
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Uploading $file to File.io..."
            response="$(curl --silent --show-error --fail --connect-timeout 15 --max-time 300 -F "file=@${file}" https://file.io)"
            link="$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); if (!data.success || !data.link) { console.error('Invalid File.io response:', data); process.exit(1); } process.stdout.write(data.link);" <<<"$response")"
            filename="$(basename "$file")"
            echo "File.io link for ${filename}: ${link}"
            echo "::notice title=File.io upload::${filename}: ${link}"
            printf -- "- %s: %s\n" "$filename" "$link" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm-build
          path: release/*.dmg
