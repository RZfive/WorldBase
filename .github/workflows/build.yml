name: Build & Release

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts (keep latest 5 per name)
        uses: actions/github-script@v7
        with:
          script: |
            const artifactNames = ['windows-build', 'mac-arm-build'];
            const keepCount = 5;

            for (const name of artifactNames) {
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                { owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100 }
              );
              // newest first
              artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const toDelete = artifacts.slice(keepCount);
              for (const artifact of toDelete) {
                console.log(`Deleting artifact: ${artifact.name} (id=${artifact.id}, created=${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

  build-windows:
    needs: cleanup
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Electron caches
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Electron (Windows)
        run: pnpm electron:build:win

      - name: Package Windows build artifacts
        id: package_windows
        shell: bash
        run: |
          archive="$(bash .github/scripts/package-release-archive.sh "release/windows-build.zip" "release/*.exe" "release/*.blockmap" "release/latest.yml")"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: ${{ steps.package_windows.outputs.archive }}
          if-no-files-found: error

  build-mac-arm:
    needs: cleanup
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Electron caches
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'electron-builder.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Electron (macOS ARM)
        run: pnpm electron:build:mac:arm64

      - name: Package macOS ARM build artifacts
        id: package_mac_arm
        shell: bash
        run: |
          archive="$(bash .github/scripts/package-release-archive.sh "release/mac-arm-build.zip" "release/*.dmg" "release/*.dmg.blockmap")"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm-build
          path: ${{ steps.package_mac_arm.outputs.archive }}
          if-no-files-found: error
