name: Build (main)

# main 分支 CI：PR 合并进 main 时构建四端产物并上传 artifact（不发布）；直推 main 不触发。
# 正式发布走 release.yml（推送 v* tag 触发 Draft Release）。

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    # 仅真正合并的 PR 触发；手动关闭（未合并）的 PR 不构建
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/reusable-build.yml
    # reusable workflow 默认不继承 secrets；缺失会导致热更包缺 manifest.sig
    secrets: inherit
