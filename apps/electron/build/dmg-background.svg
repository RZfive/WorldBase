<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- Full-bleed background: avoid a rounded inset edge that looks like a second window frame. -->
  <rect width="660" height="400" fill="#f7f8fc"/>

  <text x="330" y="52" text-anchor="middle" font-family="PingFang SC,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1f2937">WorldBase 安装说明</text>
  <text x="330" y="82" text-anchor="middle" font-family="PingFang SC,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#4b5563">将 WorldBase 拖入 Applications 文件夹</text>

  <!-- Icon centers match dmg.contents coordinates in electron-builder.json. -->
  <line x1="266" y1="200" x2="386" y2="200" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <polygon points="386,191 402,200 386,209" fill="#3b82f6"/>

  <text x="32" y="322" font-family="PingFang SC,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#374151">安装后若首次打开受阻，可双击右侧「修复并打开」脚本。</text>
  <text x="32" y="346" font-family="PingFang SC,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6b7280">脚本仅移除 WorldBase.app 的隔离标记并启动应用；请确认应用来源可信。</text>
</svg>
