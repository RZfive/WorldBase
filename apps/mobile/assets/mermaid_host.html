<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: auto;
    }
    body.dark {
      background: #1f2937;
    }
    #diagram {
      min-width: max-content;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    svg {
      max-width: none;
      height: auto;
    }
  </style>
  <script src="mermaid.min.js"></script>
</head>
<body>
  <div id="diagram"></div>
  <script>
    (() => {
      let renderSequence = 0;
      const target = document.getElementById('diagram');

      window.worldbaseRenderMermaid = async (encodedCode, dark, generation) => {
        const report = (status) => {
          try {
            if (window.MermaidStatus) {
              window.MermaidStatus.postMessage(`${status}:${generation}`);
            }
          } catch (_) {}
        };

        document.body.classList.toggle('dark', Boolean(dark));
        target.textContent = '';
        let code = '';
        try {
          code = decodeURIComponent(escape(atob(encodedCode)));
          target.textContent = code;
          if (typeof mermaid === 'undefined') {
            throw new Error('Mermaid runtime unavailable');
          }
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'strict',
            theme: dark ? 'base' : 'default',
          });
          const id = `worldbase-mermaid-${Date.now()}-${++renderSequence}`;
          const { svg } = await mermaid.render(id, code);
          target.innerHTML = svg;
          report('ok');
        } catch (error) {
          target.textContent = code;
          try {
            console.error(
              `[worldbase-mermaid] render-error:${generation}:${String(error)}`,
            );
          } catch (_) {}
          report('error');
        }
      };
    })();
  </script>
</body>
</html>
